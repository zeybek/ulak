name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v0.1.0)"
        required: true

# Tags pushed by release-please with GITHUB_TOKEN do not trigger tag-push
# workflows, so release-please.yml dispatches this workflow with the tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    name: Build Release Archive
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.path }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RELEASE_TAG" ]; then
            echo "::error::Release tag '$RELEASE_TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version.txt
        run: |
          VERSION="$(cat version.txt)"
          if [ "$VERSION" != "${{ steps.version.outputs.value }}" ]; then
            echo "Tag version (${{ steps.version.outputs.value }}) does not match version.txt ($VERSION)" >&2
            exit 1
          fi

      - name: Build and validate release archive
        run: make release-check

      - name: Set archive path
        id: archive
        run: echo "path=dist/ulak-${{ steps.version.outputs.value }}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgxn-release-archive
          path: ${{ steps.archive.outputs.path }}

      # release-please already created the GitHub release for the tag; only
      # attach the archive. softprops/action-gh-release tried to update the
      # release object as well, which the workflow token is not allowed to do
      # for older releases (backfills failed with "Resource not accessible").
      - name: Attach archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
          gh release upload "$RELEASE_TAG" "${{ steps.archive.outputs.path }}" --repo "$GITHUB_REPOSITORY" --clobber

  pgxn-publish:
    name: Publish to PGXN
    needs: package
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    env:
      PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
      PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
    steps:
      - name: Check credentials
        run: |
          if [ -z "$PGXN_USERNAME" ] || [ -z "$PGXN_PASSWORD" ]; then
            echo "::warning::PGXN credentials not configured, skipping publish"
            exit 0
          fi

      - name: Check out the repo
        if: env.PGXN_USERNAME != ''
        uses: actions/checkout@v4

      - name: Download release archive
        if: env.PGXN_USERNAME != ''
        uses: actions/download-artifact@v4
        with:
          name: pgxn-release-archive
          path: dist

      - name: Publish archive on PGXN
        if: env.PGXN_USERNAME != ''
        run: pgxn-release "dist/ulak-${{ needs.package.outputs.version }}.zip"
