name: Main CI

# Every commit reaches main through a pull request whose full PG 14-18 matrix,
# sanitizers, static analysis and clang-tidy are required checks, and the
# ruleset requires the branch to be up to date with main, so the merged tree
# is exactly the tree that was tested. A push to main therefore only runs a
# PG 18 smoke pass (regress + isolation + TAP) as a signal for the status
# line; the full matrix is available on demand through workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MAKE_FLAGS: "ENABLE_KAFKA=1 ENABLE_MQTT=1 ENABLE_REDIS=1 ENABLE_AMQP=1 ENABLE_NATS=1"
  # Protocol libraries needed for full build
  PROTOCOL_DEPS: >-
    libcurl4-openssl-dev
    librdkafka-dev
    libhiredis-dev
    libmosquitto-dev
    librabbitmq-dev
    libnats-dev
    libssl-dev

jobs:
  # ── Smoke pass on every push to main: PG 18 only ──
  smoke-regress:
    if: github.event_name == 'push'
    name: PG 18 — Regress (smoke)
    uses: ./.github/workflows/_reusable-regression.yml
    with:
      pg-version: 18
      make-flags: ENABLE_KAFKA=1 ENABLE_MQTT=1 ENABLE_REDIS=1 ENABLE_AMQP=1 ENABLE_NATS=1
      protocol-deps: >-
        libcurl4-openssl-dev
        librdkafka-dev
        libhiredis-dev
        libmosquitto-dev
        librabbitmq-dev
        libnats-dev
        libssl-dev

  smoke-tap:
    if: github.event_name == 'push'
    name: PG 18 — TAP (smoke)
    uses: ./.github/workflows/_reusable-tap.yml
    with:
      pg-version: 18
      make-flags: ENABLE_KAFKA=1 ENABLE_MQTT=1 ENABLE_REDIS=1 ENABLE_AMQP=1 ENABLE_NATS=1
      protocol-deps: >-
        libcurl4-openssl-dev
        librdkafka-dev
        libhiredis-dev
        libmosquitto-dev
        librabbitmq-dev
        libnats-dev
        libssl-dev

  # ── Full matrix, on demand (workflow_dispatch) ──
  regress:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 17, 16, 15, 14]
    name: PG ${{ matrix.pg }} — Regress
    uses: ./.github/workflows/_reusable-regression.yml
    with:
      pg-version: ${{ matrix.pg }}
      make-flags: ENABLE_KAFKA=1 ENABLE_MQTT=1 ENABLE_REDIS=1 ENABLE_AMQP=1 ENABLE_NATS=1
      protocol-deps: >-
        libcurl4-openssl-dev
        librdkafka-dev
        libhiredis-dev
        libmosquitto-dev
        librabbitmq-dev
        libnats-dev
        libssl-dev

  tap:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 17, 16, 15, 14]
    name: PG ${{ matrix.pg }} — TAP
    uses: ./.github/workflows/_reusable-tap.yml
    with:
      pg-version: ${{ matrix.pg }}
      make-flags: ENABLE_KAFKA=1 ENABLE_MQTT=1 ENABLE_REDIS=1 ENABLE_AMQP=1 ENABLE_NATS=1
      protocol-deps: >-
        libcurl4-openssl-dev
        librdkafka-dev
        libhiredis-dev
        libmosquitto-dev
        librabbitmq-dev
        libnats-dev
        libssl-dev

  static-analysis:
    if: github.event_name == 'workflow_dispatch'
    name: Static Analysis
    uses: ./.github/workflows/_reusable-static-analysis.yml

  # ── clang-tidy: deep AST-based analysis ──
  clang-tidy:
    name: clang-tidy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -i -v 18
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-server-dev-18 \
            ${{ env.PROTOCOL_DEPS }} \
            clang-tidy-22 \
            bear

      - name: Show tool versions
        run: |
          clang-tidy-22 --version
          bear --version

      - name: Generate compile_commands.json
        run: bear -- make ${{ env.MAKE_FLAGS }}

      - name: Run clang-tidy
        shell: bash
        run: |
          # pipefail + captured exit code: without this the trailing `tee` (which
          # always exits 0) masks clang-tidy's --warnings-as-errors failure, making
          # this gate decorative. `|| rc=$?` lets the notice line still run.
          set -o pipefail
          rc=0
          # One clang-tidy process per core (xargs -P), a few files each; xargs
          # exits 123 when any invocation fails, so the gate still trips.
          find src -name "*.c" | \
            xargs -P "$(nproc)" -n 4 clang-tidy-22 -p . \
              --warnings-as-errors='clang-analyzer-core.*,bugprone-null-dereference' \
              2>&1 | tee clang-tidy-output.txt || rc=$?
          echo ""
          WARNS=$(grep -c "warning:" clang-tidy-output.txt || echo 0)
          echo "::notice::clang-tidy: $WARNS warning(s)"
          exit "$rc"

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-output.txt

  sanitizers:
    if: github.event_name == 'workflow_dispatch'
    name: ASan + UBSan
    uses: ./.github/workflows/_reusable-sanitizers.yml
    with:
      make-flags: ENABLE_KAFKA=1 ENABLE_MQTT=1 ENABLE_REDIS=1 ENABLE_AMQP=1 ENABLE_NATS=1
      protocol-deps: >-
        libcurl4-openssl-dev
        librdkafka-dev
        libhiredis-dev
        libmosquitto-dev
        librabbitmq-dev
        libnats-dev
        libssl-dev
